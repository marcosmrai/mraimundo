project:
  type: website
  output-dir: "../../static/"
  lib-dir: site_libs
  render:
    - "*.qmd"

execute:
  freeze: auto # 'auto' compila apenas os arquivos .qmd que foram alterados

format:
  html:
    theme: cosmo
    toc: true
    code-fold: false
    html-math-method: mathjax
    output-file: "notas.html"
    include-before-body: ../../assets/media/back-notes.html
  revealjs:
    transition: slide
    scrollable: false
    slide-number: false
    output-file: "slides.html"
    theme: [default, custom.scss]
    width: 1280
    height: 800
    margin: 0.1
    footer: "UNICAMP — Instituto de Computação"
    include-after-body: ../../assets/media/logos.html
    title-slide-attributes:
      data-background-image: "../../logos/UNICAMP.png, ../../logos/IC.png"
      data-background-size: "140px, 140px"
      data-background-position: "5% 8%, 95% 8%"
    chalkboard: 
      boardmarker-width: 3
      chalk-width: 3